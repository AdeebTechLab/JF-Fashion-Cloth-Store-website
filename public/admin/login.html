<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — JF Fashion</title>
<link rel="icon" type="image/x-icon" href="../images/icons/jf-fashion-favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../images/icons/jf-fashion-favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/icons/jf-fashion-favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/icons/jf-fashion-favicon-180.png">
<link rel="stylesheet" href="admin.css">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #fff;
    /* The login page is a single fixed screen: it must never scroll. If the
       viewport is too short for the card, only the form column scrolls. */
    overflow: hidden;
    overscroll-behavior: none;
  }
  .login-screen {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    height: 100vh;
    height: 100dvh; /* mobile browsers: use the visible viewport, not the chrome-inclusive one */
    min-height: 0;
    overflow: hidden;
  }

  /* ---------- Left: hero panel ---------- */
  .login-hero {
    position: relative;
    background: #1a1310 url('/images/deal-of-week-hero.webp') center/cover no-repeat;
    display: flex;
    align-items: flex-end;
    padding: 56px;
    overflow: hidden;
  }
  .login-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,8,7,0.15) 0%, rgba(10,8,7,0.35) 45%, rgba(8,6,5,0.92) 100%);
  }
  .login-hero-logo {
    position: absolute;
    top: 56px;
    left: 56px;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    background: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  .login-hero-logo img {
    height: 30px;
    width: auto;
    display: block;
  }
  .login-hero-content {
    position: relative;
    z-index: 1;
    color: #fff;
    max-width: 460px;
  }
  .login-hero-eyebrow {
    font-family: PlayfairDisplay-Bold, serif;
    font-style: italic;
    font-size: 26px;
    color: #e7a15c;
    margin: 0 0 10px;
  }
  .login-hero-content h2 {
    font-family: PlayfairDisplay-Bold, serif;
    font-size: 40px;
    line-height: 1.18;
    margin: 0 0 18px;
    letter-spacing: 0.2px;
  }
  .login-hero-content p {
    font-family: Poppins-Regular, sans-serif;
    font-size: 14.5px;
    line-height: 1.7;
    color: rgba(255,255,255,0.78);
    margin: 0;
    max-width: 380px;
  }

  /* ---------- Right: form panel ---------- */
  .login-form-panel {
    display: flex;
    align-items: stretch;   /* card fills the column; the padding below is the "gap" */
    justify-content: center;
    padding: 28px;
    background: #fbfbfb;
    min-height: 0;      /* let the grid row shrink instead of pushing the page taller */
    overflow-y: auto;   /* last-resort scroll confined to this column */
    overflow-x: hidden;
  }
  .login-card {
    width: 100%;
    background: #fff;
    padding: clamp(28px, 3vw, 56px) clamp(24px, 3vw, 48px);
    border-radius: 18px;
    box-shadow: 0 2px 8px rgba(20,16,10,0.04), 0 12px 32px rgba(20,16,10,0.06);
    border: 1px solid var(--border);
    /* The card now spans the whole panel (minus the small gap above). The form
       itself stays at a comfortable reading width, vertically centred inside. */
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .login-card-inner {
    width: 100%;
    /* Grows with the card so the form never looks lost inside a big panel. */
    max-width: clamp(320px, 34vw, 560px);
    /* `margin:auto` centres the form but still lets the top be reached when the
       card is too short for the content (plain centering would clip it). */
    margin: auto;
  }
  .login-brand-row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.1vw, 20px);
    margin-bottom: clamp(24px, 2.4vw, 46px);
  }
  .login-brand-row .logo-badge {
    width: clamp(44px, 3.6vw, 68px);
    height: clamp(44px, 3.6vw, 68px);
    flex-shrink: 0;
  }
  .login-brand-eyebrow {
    font-family: Poppins-SemiBold, sans-serif;
    font-size: clamp(10.5px, 0.9vw, 14px);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--brand);
    margin: 0 0 3px;
  }
  .login-brand-row h1 {
    font-family: PlayfairDisplay-Bold, serif;
    font-size: clamp(18px, 1.6vw, 28px);
    margin: 0;
    color: var(--text);
  }
  .login-card h2.welcome {
    font-family: PlayfairDisplay-Bold, serif;
    font-size: clamp(28px, 2.6vw, 48px);
    line-height: 1.15;
    margin: 0 0 clamp(8px, 0.9vw, 18px);
    color: var(--text);
  }
  .subtitle {
    font-family: Poppins-Regular, sans-serif;
    color: var(--muted);
    font-size: clamp(13.5px, 1.2vw, 18.5px);
    line-height: 1.6;
    margin: 0 0 clamp(20px, 2.1vw, 38px);
  }
  label {
    display: block;
    font-family: Poppins-SemiBold, sans-serif;
    font-size: clamp(10.5px, 0.9vw, 14px);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: clamp(6px, 0.6vw, 10px);
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: clamp(14px, 1.15vw, 23px) clamp(15px, 1.25vw, 26px);
    border-radius: 6px;
    border: 1px solid var(--border-dark);
    font-family: Poppins-Regular, sans-serif;
    font-size: clamp(14.5px, 1.2vw, 18.5px);
    margin-bottom: clamp(15px, 1.3vw, 26px);
    background: #fff;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: #b9b9b9; }
  input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(113,127,224,0.15);
  }
  .login-card button {
    width: 100%;
    padding: clamp(15px, 1.3vw, 24px);
    font-size: clamp(12.5px, 1.05vw, 17px);
    letter-spacing: 1px;
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(113,127,224,0.25);
  }
  .login-card button:disabled {
    opacity: 0.7;
    cursor: default;
    box-shadow: none;
  }
  .error {
    background: var(--danger-bg);
    color: var(--danger);
    border-left: 3px solid var(--danger);
    padding: clamp(11px, 0.9vw, 16px) clamp(13px, 1.1vw, 20px);
    font-family: Poppins-Regular, sans-serif;
    font-size: clamp(13px, 1.05vw, 16.5px);
    margin-bottom: clamp(14px, 1.3vw, 24px);
    display: none;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: clamp(16px, 1.7vw, 32px);
    font-family: Poppins-Regular, sans-serif;
    font-size: clamp(12.5px, 1vw, 16.5px);
    color: var(--muted);
    text-decoration: none;
  }
  .back-link:hover { color: var(--brand); }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .login-screen { grid-template-columns: 1fr; }
    .login-hero { display: none; }
    .login-form-panel { padding: 20px; min-height: 0; }
    .login-card { box-shadow: none; border: none; padding: 0; border-radius: 0; }
    .login-card-inner { max-width: 100%; }
  }
  @media (max-width: 420px) {
    .login-card h2.welcome { font-size: clamp(24px, 6.2vw, 28px); }
    .login-brand-row .logo-badge { width: clamp(38px, 10vw, 44px); height: clamp(38px, 10vw, 44px); }
  }

  /* Short viewports (laptops at 125%/150% scaling, landscape phones):
     compress the card so the whole form still fits without any scrolling. */
  @media (max-height: 760px) {
    .login-form-panel { padding: 22px; }
    .login-card { padding: clamp(20px, 2.2vw, 36px) clamp(20px, 2.8vw, 46px); }
    .login-brand-row { margin-bottom: clamp(18px, 1.9vw, 32px); }
    .login-card h2.welcome { font-size: clamp(26px, 2.3vw, 38px); margin-bottom: clamp(7px, 0.7vw, 13px); }
    .subtitle { margin-bottom: clamp(16px, 1.6vw, 28px); font-size: clamp(13px, 1.05vw, 16px); }
    input { padding: clamp(11px, 0.95vw, 17px) clamp(13px, 1.05vw, 20px); margin-bottom: clamp(12px, 1.05vw, 20px); }
    .login-card button { padding: clamp(13px, 1.1vw, 19px); }
    .back-link { margin-top: clamp(13px, 1.15vw, 22px); }
    .login-hero { padding: 36px; }
    .login-hero-logo { top: 36px; left: 36px; }
    .login-hero-content h2 { font-size: 30px; margin-bottom: 12px; }
    .login-hero-eyebrow { font-size: 22px; }
  }
  @media (max-height: 620px) {
    .login-form-panel { padding: 14px; }
    .login-card { padding: clamp(16px, 1.8vw, 28px) clamp(16px, 2.2vw, 36px); }
    .login-brand-row { margin-bottom: clamp(13px, 1.4vw, 22px); }
    .login-brand-row .logo-badge { width: clamp(36px, 2.8vw, 50px); height: clamp(36px, 2.8vw, 50px); }
    .login-card h2.welcome { font-size: clamp(21px, 1.8vw, 30px); margin-bottom: clamp(5px, 0.6vw, 10px); }
    .subtitle { margin-bottom: clamp(11px, 1.1vw, 18px); font-size: clamp(12.5px, 0.95vw, 14px); line-height: 1.45; }
    label { margin-bottom: 5px; }
    input { padding: clamp(9px, 0.75vw, 14px) clamp(11px, 0.9vw, 17px); margin-bottom: clamp(9px, 0.85vw, 15px); }
    .login-card button { padding: clamp(11px, 0.95vw, 17px); }
    .back-link { margin-top: clamp(9px, 0.9vw, 16px); }
  }

  /* iOS Safari zooms in on focus if an input's font-size is under 16px */
  @media (max-width: 600px) {
    input { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="login-screen">

    <div class="login-hero">
      <div class="login-hero-logo">
        <img src="../images/icons/jf-fashion-logo.webp" alt="JF Fashion">
      </div>
      <div class="login-hero-content">
        <p class="login-hero-eyebrow">JF Fashion</p>
        <h2>Manage every&nbsp;piece from one place.</h2>
        <p>Keep your catalogue, pricing and product photography fresh with a simple and secure store dashboard.</p>
      </div>
    </div>

    <div class="login-form-panel">
      <div class="login-card">
        <div class="login-card-inner">
          <div class="login-brand-row">
            <div class="logo-badge"><img src="../images/icons/jf-fashion-logo.webp" alt="JF Fashion"></div>
            <div>
              <p class="login-brand-eyebrow">Store Portal</p>
              <h1>JF Fashion Admin</h1>
            </div>
          </div>

          <h2 class="welcome">Welcome back</h2>
          <p class="subtitle">Sign in securely to manage your products, pricing and photography.</p>

          <div class="error" id="error-box"></div>

          <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

            <button type="submit" id="submit-btn" class="btn btn-primary">Sign In to Dashboard</button>
          </form>

          <a class="back-link" href="../index.html">&larr; Back to website</a>
        </div>
      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    // If already logged in, skip straight to the dashboard.
    fetch('/api/session').then(r => r.json()).then(data => {
      if (data.authenticated) window.location.href = '/admin/index.html';
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/admin/index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
